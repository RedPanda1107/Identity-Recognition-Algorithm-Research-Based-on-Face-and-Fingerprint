# 单模态指纹识别配置文件
# 专为毕业论文单模态指纹识别实验设计
#
# 统一输出结构：outputs/fingerprint/<experiment_name>/
#   ├── checkpoints/best.pth
#   ├── logs/training_history.json
#   └── figures/training_curves.png

training:
  epochs: 50
  batch_size: 32
  freeze_epochs: 5
  freeze_learning_rate: 3e-4
  warmup_epochs: 5
  warmup_start_lr: 3e-6
  unfreeze_lr: 3e-4
  head_lr_ratio: 5.0
  weight_decay: 5e-4
  optimizer: 'adamw'
  scheduler_type: 'step'
  scheduler_step: 15
  scheduler_gamma: 0.1
  label_smoothing: 0.0
  metric_learning: true
  arc_s: 30.0
  arc_m_start: 0.1
  arc_m_end: 0.35
  arc_m_warmup_epochs: 10
  arc_m_delay_epochs: 3
  tta: false
  use_amp: false

model:
  model_type: 'fingerprint_net'
  embedding_dim: 512
  num_classes: 500
  pretrained: true
  dropout_rate: 0.3
  spatial_attention: false

data:
  image_size: 224
  use_augmentation: true
  use_clahe: true
  split_ratio: 0.8
  test_split_ratio: 0.5
  gallery_per_person: 3
  augmentation:
    random_horizontal_flip: false
    random_rotation: 15
    color_jitter: true
    color_jitter_brightness: 0.1
    color_jitter_contrast: 0.1
    color_jitter_saturation: 0.0
    color_jitter_hue: 0.0
    random_crop: false
    random_resized_crop: false
    random_erasing_prob: 0.1
    random_erasing_scale: [0.02, 0.15]
    translate: [0.03, 0.03]
    scale: [0.97, 1.03]

paths:
  data_dir: './data'
  modality_data_dir: './data/CASIA-FingerprintV5(BMP)'
  checkpoint_dir: 'outputs/fingerprint/checkpoints'
  log_dir: 'outputs/fingerprint'
  results_dir: 'outputs/fingerprint'
  visualization_dir: 'outputs/fingerprint'

misc:
  seed: 42
  num_workers: 0
  save_freq: 5
  log_freq: 10
  use_amp: false
  experiment_name: 'fingerprint_recognition'
  early_stopping: true
  early_stopping_patience: 10
  early_stopping_warmup: 20

experiment:
  ablation_study: false
  test_time_augmentation: false
  save_features: false
  evaluate_every_epoch: true

debug:
  debug_mode: false
  max_samples: null
  log_images: false
