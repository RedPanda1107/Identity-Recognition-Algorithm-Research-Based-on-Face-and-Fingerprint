# 临时短训配置（用于快速验证修复）
training:
  epochs: 2
  freeze_epochs: 2
  freeze_learning_rate: 1e-4
  warmup_epochs: 1
  warmup_start_lr: 1e-6
  unfreeze_lr: 5e-5
  head_lr_ratio: 5.0
  weight_decay: 5e-4
  metric_learning: true
  arc_s: 30.0
  arc_m_start: 0.0
  arc_m_end: 0.35
  arc_m_warmup_epochs: 25
  arc_m_delay_epochs: 15
  label_smoothing: 0.1
  tta: true
  batch_size: 32
  optimizer: 'adam'
  scheduler_type: 'step'
  scheduler_step: 20
  scheduler_gamma: 0.5
  scheduler_patience: 8
  scheduler_factor: 0.5

model:
  model_type: 'fingerprint_net'
  embedding_dim: 512
  num_classes: 500
  pretrained: true
  dropout_rate: 0.5
  spatial_attention: false

data:
  image_size: 224
  use_augmentation: true
  use_clahe: true
  split_ratio: 0.8
  test_split_ratio: 0.5
  gallery_per_person: 3
  augmentation:
    random_horizontal_flip: false
    random_rotation: 15
    color_jitter: true
    color_jitter_brightness: 0.1
    color_jitter_contrast: 0.1
    color_jitter_saturation: 0.0
    color_jitter_hue: 0.0
    random_crop: false
    random_resized_crop: false
    random_erasing_prob: 0.1
    random_erasing_scale: [0.02, 0.15]
    translate: [0.03, 0.03]
    scale: [0.97, 1.03]

paths:
  data_dir: './data'
  modality_data_dir: 'D:/VSpro/1.0/.idea/src/data/CASIA-FingerprintV5(BMP)'
  checkpoint_dir: 'D:/VSpro/1.0/.idea/src/checkpoints/fingerprint_debug'
  log_dir: 'D:/VSpro/1.0/.idea/src/logs/fingerprint_debug'
  config_dir: 'D:/VSpro/1.0/.idea/src/configs'
  results_dir: 'D:/VSpro/1.0/.idea/src/results/fingerprint_debug'

misc:
  seed: 42
  num_workers: 0
  save_freq: 5
  log_freq: 10
  use_amp: false
  experiment_name: 'fingerprint_recognition_debug'
  early_stopping: false
  early_stopping_patience: 10
  early_stopping_warmup: 5

experiment:
  ablation_study: false
  test_time_augmentation: false
  save_features: false
  evaluate_every_epoch: true

debug:
  debug_mode: true
  max_samples: 200
  log_images: false
