# 单模态人脸识别配置文件
# 专为毕业论文单模态人脸识别实验设计

# 训练配置
training:
  epochs: 50  # 增加训练轮次以便更充分训练
  batch_size: 32
  learning_rate: 3e-5  # ArcFace s=30 时可用稍高学习率
  weight_decay: 5e-4  # 增强正则化以减少过拟合
  optimizer: 'adam'    # 切换为 Adam 优化器
  scheduler_step: 15   # 每15个epoch衰减学习率
  scheduler_gamma: 0.1
  warmup_epochs: 5    # 线性 warmup epoch 数，确保学习率平滑爬升
  freeze_backbone_epochs: 3  # 先训练分类头3轮，避免随机初始化梯度破坏预训练权重

# 模型配置（单模态人脸识别）
model:
  model_type: 'facenet'  # 'facenet' 或 'facenet_arcface'
  embedding_dim: 512
  num_classes: 500  # 500 人（000-499，与指纹数据集完全对齐）
  pretrained: true  # 使用ImageNet预训练权重
  dropout_rate: 0.5  # 稍微加大dropout以缓解过拟合
  spatial_attention: false  # 人脸暂时禁用spatial attention，排除干扰
  # ArcFace 参数（渐进式配置）
  # s: 缩放因子，控制分类难度。s越大，分类越难，但对500类小规模数据集不需要太大
  # m: 角度 margin，增大类间距离。m越大，特征越分离，但需要更多训练轮次
  arc_s: 30.0   # 30-50 对中小规模数据集更稳定（标准值 64 适合百万级数据集）
  arc_m: 0.35   # 0.3-0.4 是合理的中间值（标准值 0.5 适合大规模数据集）

# 数据配置
data:
  image_size: 224
  use_augmentation: true  # 是否使用数据增强
  split_ratio: 0.8        # Person-wise 划分：80% 训练 20% 验证+测试
  test_split_ratio: 0.5   # 验证集中划分比例：50% val（早停用），50% test（最终评估用）
                          # 设置为 1.0 则不使用测试集（仅 val）
  gallery_per_person: 3   # 验证/测试集 Gallery 每人的图片数
  augmentation:
    random_horizontal_flip: true
    random_rotation: 10
    color_jitter: true
    random_crop: false
    random_resized_crop: true
    random_erasing_prob: 0.2  # 使用RandomErasing增强鲁棒性

# 路径配置
paths:
  data_dir: 'D:/VSpro/1.0/.idea/src/data'
  modality_data_dir: 'D:/VSpro/1.0/.idea/src/data/face/face'
  checkpoint_dir: 'D:/VSpro/1.0/.idea/src/checkpoints/face'
  log_dir: 'D:/VSpro/1.0/.idea/src/logs/face'
  config_dir: 'D:/VSpro/1.0/.idea/src/configs'
  results_dir: 'D:/VSpro/1.0/.idea/src/results/face'

# 其他配置
misc:
  seed: 42
  num_workers: 0  # 设置为0避免多进程数据加载问题
  save_freq: 5  # 每5个epoch保存一次检查点
  log_freq: 10  # 每10个batch记录一次日志
  use_amp: false  # 临时禁用混合精度，使用 fp32 训练以确保数值稳定
  experiment_name: 'face_recognition_baseline'  # 实验名称
  early_stopping: true
  early_stopping_patience: 20  # 给ArcFace足够的收敛窗口

# 实验配置（用于消融实验）
experiment:
  ablation_study: false  # 是否进行消融实验
  test_time_augmentation: false  # 测试时数据增强
  save_features: false  # 是否保存特征向量
  evaluate_every_epoch: true  # 每个epoch都进行验证

# 调试配置
debug:
  debug_mode: false
  max_samples: null  # 限制训练样本数量用于调试
  log_images: false  # 是否记录图像到TensorBoard