# 单模态人脸识别配置文件
# 专为毕业论文单模态人脸识别实验设计
#
# 统一输出结构：outputs/face/<experiment_name>/
#   ├── checkpoints/best.pth
#   ├── logs/training_history.json
#   └── figures/training_curves.png

training:
  epochs: 50
  batch_size: 32
  learning_rate: 1e-4
  weight_decay: 5e-4
  optimizer: 'adamw'
  scheduler_type: 'step'
  scheduler_step: 15
  scheduler_gamma: 0.1
  warmup_epochs: 5
  warmup_start_lr: 3e-6
  freeze_backbone_epochs: 3
  label_smoothing: 0.0

model:
  model_type: 'facenet'
  embedding_dim: 512
  num_classes: 500
  pretrained: true
  dropout_rate: 0.5
  spatial_attention: false
  arc_s: 30.0
  arc_m: 0.35

data:
  image_size: 224
  use_augmentation: true
  split_ratio: 0.8
  test_split_ratio: 0.5
  gallery_per_person: 3
  # 轻度增强（Light）：仅水平翻转 + ±5° 旋转
  # 对比说明：
  #   None  : 无增强（baseline）
  #   Light : 水平翻转(p=0.5) + 旋转±5°（当前配置）
  #   Medium: 翻转 + 旋转±10° + ColorJitter + RandomErasing 0.2（原有配置）
  augmentation:
    random_horizontal_flip: true
    random_rotation: 5        # 原有10° → 降至5°
    color_jitter: false       # 原有true → 关闭
    random_crop: false
    random_resized_crop: false # 原有true → 关闭
    random_erasing_prob: 0.0   # 原有0.2 → 关闭

paths:
  data_dir: './data'
  modality_data_dir: './data/face/face'
  checkpoint_dir: 'outputs/face/checkpoints'
  log_dir: 'outputs/face'
  results_dir: 'outputs/face'
  visualization_dir: 'outputs/face'

misc:
  seed: 42
  num_workers: 0
  save_freq: 5
  log_freq: 10
  use_amp: false
  experiment_name: 'face_recognition'
  early_stopping: true
  early_stopping_patience: 10

experiment:
  ablation_study: false
  test_time_augmentation: false
  save_features: false
  evaluate_every_epoch: true

debug:
  debug_mode: false
  max_samples: null
  log_images: false
