# 多模态人脸+指纹融合识别配置文件
# 特征级融合方案 - 简化版（无ArcFace）

training:
  epochs: 50
  batch_size: 16  # 减小 batch size 以适应 6GB GPU（同时训练3个ResNet50）
  accumulation_steps: 2  # 梯度累积步数，实际 batch = 16*2=32
  learning_rate: 1e-4
  weight_decay: 1e-4
  freeze_backbone: false  # 训练backbone
  label_smoothing: 0.1
  use_amp: true  # 启用混合精度训练节省显存

model:
  face_embedding_dim: 512
  fingerprint_embedding_dim: 512
  fusion_dim: 256
  fusion_dropout_rate: 0.3
  num_classes: 500  # 500 人（000-499，与数据集完全对齐）
  use_arcface: true            # 启用 ArcFace 度量学习 (学术标准配置)
  arc_s: 64.0                  # Scale factor
  arc_m: 0.5                   # Angular margin penalty

data:
  face_image_size: 224
  fingerprint_image_size: 224
  use_augmentation: true
  split_ratio: 0.8           # Person-wise 划分：80% 训练 20% 剩余人员
  test_split_ratio: 0.5     # 剩余人员中 50% 验证 50% 测试 (最终: 70%训练 10%验证 20%测试)
  gallery_per_person: 3        # 验证/测试集 Gallery 每人的图片数
  augmentation:
    random_horizontal_flip: true
    random_rotation: 10
    color_jitter: false
    random_erasing_prob: 0.0

paths:
  data_dir: 'D:/VSpro/1.0/.idea/src/data'
  face_data_dir: 'D:/VSpro/1.0/.idea/src/data/face/face'
  fingerprint_data_dir: 'D:/VSpro/1.0/.idea/src/data/CASIA-FingerprintV5(BMP)'
  mapping_file: 'D:/VSpro/1.0/.idea/src/data/face_casia_mapping.json'
  pretrained_face: ''
  pretrained_fingerprint: ''

misc:
  seed: 42
  num_workers: 4
  save_freq: 10
  early_stopping: true
  early_stopping_patience: 15
